<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>التحقق من الرقم</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>.container{max-width:420px}.card{padding:1.25rem!important}</style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="card shadow p-4">
    <h5 class="text-center mb-3">التحقق من الرقم</h5>
    {% with msgs=get_flashed_messages(with_categories=true) %}{% for c,m in msgs %}
      <div class="alert alert-{{c}}">{{m}}</div>
    {% endfor %}{% endwith %}
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">الرقم</label>
        <input name="phone" value="{{ phone or '' }}" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">رمز SMS</label>
        <input name="otp" class="form-control" maxlength="6" required>
      </div>
      <button class="btn btn-primary w-100">تحقق</button>
    </form>
  </div>
</div>
</body>
</html>
