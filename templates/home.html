<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحة النتائج | Epsilon Education</title>
  <meta name="description" content="صفحة نتائج المسابقات الوطنية من Epsilon Education: الباكالوريا، ابريفة، وكونكور.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ url_for('home', _external=True) }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Epsilon Education">
  <meta property="og:title" content="صفحة النتائج | Epsilon Education">
  <meta property="og:description" content="اختر نوع المسابقة وابحث عن النتيجة بسهولة.">
  <meta property="og:url" content="{{ url_for('home', _external=True) }}">
  <meta property="og:image" content="{{ url_for('static', filename='epsilon.svg', _external=True) }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #2f5bea;
      --blue-dark: #2457d6;
      --green: #0f8a78;
      --ink: #111827;
      --muted: #64748b;
      --line: #e5eaf5;
      --soft: #f6f8ff;
      --white: #ffffff;
      --shadow: 0 18px 46px rgba(31, 41, 71, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Tajawal", system-ui, sans-serif;
      color: var(--ink);
      background: var(--white);
    }

    a { color: inherit; }

    .page {
      width: min(100% - 28px, 440px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 0 28px;
    }

    .topbar {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      direction: ltr;
      text-decoration: none;
      color: var(--blue);
      font-size: 18px;
      font-weight: 900;
    }

    .brand img {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    .top-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .top-link {
      min-height: 34px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 1px solid var(--line);
      color: var(--blue);
      background: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 900;
    }

    .results-header {
      min-height: 96px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-radius: 18px;
      color: #fff;
      background: var(--blue);
      box-shadow: 0 18px 34px rgba(47, 91, 234, .22);
    }

    .header-icon,
    .tile-icon,
    .field-icon,
    .row-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .header-icon svg {
      width: 38px;
      height: 38px;
    }

    .results-header h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      font-weight: 900;
    }

    .results-header p {
      margin: 8px 0 0;
      color: rgba(255, 255, 255, .78);
      font-size: 15px;
      line-height: 1.35;
      font-weight: 800;
    }

    .offers {
      margin-top: 18px;
    }

    .offer-stage {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      background: #edf2ff;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .offer-stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .offer-empty {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background: #f8fbff;
    }

    .offer-empty img {
      width: min(54%, 210px);
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 14px 26px rgba(47, 91, 234, .16));
    }

    .offer-dots {
      position: absolute;
      inset-inline: 0;
      bottom: 12px;
      display: flex;
      justify-content: center;
      gap: 7px;
    }

    .offer-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      border: 0;
      background: rgba(255, 255, 255, .66);
      padding: 0;
    }

    .offer-dot.active { background: var(--blue); }

    .result-tiles {
      margin-top: 76px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .result-tile {
      aspect-ratio: 1 / 1;
      border: 0;
      border-radius: 18px;
      background: var(--blue-dark);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 10px;
      cursor: pointer;
      box-shadow: 0 16px 32px rgba(36, 87, 214, .22);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .result-tile:hover,
    .result-tile:focus-visible,
    .result-tile.active {
      transform: translateY(-3px);
      background: #1f4cc5;
      box-shadow: 0 20px 38px rgba(36, 87, 214, .30);
      outline: none;
    }

    .tile-icon svg {
      width: 38px;
      height: 38px;
    }

    .result-tile span {
      max-width: 100%;
      color: #fff;
      text-align: center;
      font-size: 22px;
      line-height: 1.18;
      font-weight: 900;
    }

    .search-card,
    .text-section,
    .result-card,
    .message-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .search-card {
      display: none;
      margin-top: 22px;
      padding: 18px;
    }

    .search-card.active { display: block; }

    .search-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      color: var(--ink);
      font-size: 22px;
      font-weight: 900;
    }

    .search-title svg {
      width: 28px;
      height: 28px;
      color: var(--blue);
    }

    .field {
      position: relative;
      margin-top: 12px;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 56px;
      padding: 0 54px 0 16px;
      border: 2px solid #45534f;
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font: 800 18px "Tajawal", system-ui, sans-serif;
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(15, 138, 120, .10);
    }

    .field-icon {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #45534f;
      pointer-events: none;
    }

    .field-icon svg {
      width: 26px;
      height: 26px;
    }

    .search-button,
    .contact-button {
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      font: 900 20px "Tajawal", system-ui, sans-serif;
    }

    .search-button {
      margin-top: 16px;
      background: var(--green);
    }

    .search-button:disabled {
      cursor: wait;
      opacity: .72;
    }

    .contact-button {
      margin-top: 72px;
      background: var(--blue-dark);
    }

    .text-section {
      display: none;
      margin-top: 34px;
      padding: 18px;
      background: #f8fbff;
    }

    .text-section.active { display: block; }

    .text-section h2 {
      margin: 0 0 8px;
      color: var(--blue-dark);
      font-size: 20px;
      font-weight: 900;
    }

    .text-section p {
      margin: 0;
      color: #334155;
      font-size: 16px;
      line-height: 1.65;
      font-weight: 700;
      white-space: pre-line;
    }

    .results-list {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .message-card {
      padding: 18px;
      color: var(--muted);
      text-align: center;
      font-weight: 800;
    }

    .message-card.success {
      border-color: #b7ebcd;
      background: #edfff4;
      color: #11814f;
      text-align: right;
    }

    .message-card.error {
      border-color: #fecaca;
      background: #fff1f2;
      color: #b91c1c;
    }

    .result-card {
      padding: 18px;
    }

    .result-card h3 {
      margin: 0 0 16px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      color: #1e429f;
      font-size: 22px;
      font-weight: 900;
    }

    .result-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #e5e7eb;
      align-items: start;
    }

    .result-row:last-child { border-bottom: 0; }

    .result-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #586478;
      font-size: 17px;
      font-weight: 900;
    }

    .row-icon svg {
      width: 22px;
      height: 22px;
      color: var(--blue);
    }

    .result-value {
      direction: auto;
      color: var(--ink);
      font-size: 18px;
      font-weight: 900;
      overflow-wrap: anywhere;
      text-align: left;
    }

    .footer {
      margin-top: 16px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      font-weight: 900;
      direction: ltr;
    }

    .footer-links {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      gap: 22px;
      color: var(--blue);
      direction: rtl;
    }

    .footer-links a {
      text-decoration: none;
      font-weight: 900;
    }

    .hidden { display: none !important; }

    @media (max-width: 420px) {
      .page { width: min(100% - 22px, 390px); }
      .brand span { display: none; }
      .results-header h1 { font-size: 25px; }
      .results-header p { font-size: 14px; }
      .result-tiles { gap: 10px; }
      .result-tile { border-radius: 16px; }
      .tile-icon svg { width: 34px; height: 34px; }
      .result-tile span { font-size: 19px; }
      .result-row {
        grid-template-columns: 1fr;
        gap: 7px;
      }
      .result-value { text-align: right; }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="topbar" aria-label="روابط الموقع">
      <a class="brand" href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='epsilon.svg') }}" alt="">
        <span>epsilon education</span>
      </a>
      <div class="top-actions">
        <a class="top-link" href="{{ url_for('login') }}">تسجيل الدخول</a>
        <a class="top-link" href="{{ url_for('register') }}">إنشاء حساب</a>
      </div>
    </nav>

    <section class="results-header" aria-labelledby="results-title">
      <span class="header-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M8 7h8M8 12h5M8 17h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="2.2"/>
          <path d="m15.5 12.5 1.5 1.5 3-3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <div>
        <h1 id="results-title">صفحة النتائج</h1>
        <p>اختر نوع المسابقة للاطلاع على النتائج</p>
      </div>
    </section>

    <section class="offers" aria-label="العروض">
      <div class="offer-stage" id="offerStage">
        <div class="offer-empty">
          <img src="{{ url_for('static', filename='epsilon.svg') }}" alt="Epsilon Education">
        </div>
      </div>
    </section>

    <section class="result-tiles" aria-label="أنواع النتائج">
      <button class="result-tile" type="button" data-exam="bac-first" data-title="نتائج الباكالوريا الدورة الأولى">
        <span class="tile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M7 4h10v6a5 5 0 0 1-10 0V4Z" stroke="currentColor" stroke-width="2.2"/>
            <path d="M7 7H4v2a3 3 0 0 0 3 3M17 7h3v2a3 3 0 0 1-3 3M12 15v4M9 20h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </span>
        <span>الباكالوريا<br>الدورة الأولى</span>
      </button>
      <button class="result-tile" type="button" data-exam="brevet" data-title="نتائج ابريفة">
        <span class="tile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 5.5A3.5 3.5 0 0 1 8.5 2H20v17H8.5A3.5 3.5 0 0 0 5 22V5.5Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M5 5.5A3.5 3.5 0 0 0 1.5 2H4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M9 6h7M9 10h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </span>
        <span>ابريفة</span>
      </button>
      <button class="result-tile" type="button" data-exam="concours" data-title="نتائج كونكور">
        <span class="tile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="m2 9 10-5 10 5-10 5L2 9Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M6 11.5V16c2.7 2 9.3 2 12 0v-4.5" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M22 9v6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </span>
        <span>كونكور</span>
      </button>
    </section>

    <section class="search-card" id="searchCard" aria-live="polite">
      <div class="search-title">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.4"/>
        </svg>
        <span id="searchTitle">البحث عن نتيجة</span>
      </div>

      <div class="field hidden" id="centerField">
        <span class="field-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M3 21h18M5 21V9h14v12M4 9l8-5 8 5M9 13h6M9 17h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <select id="centerSelect">
          <option value="">مركز الامتحان</option>
        </select>
      </div>

      <div class="field">
        <span class="field-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M7 7h10M7 12h10M7 17h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="2.2"/>
          </svg>
        </span>
        <input id="queryInput" type="search" inputmode="search" autocomplete="off" placeholder="رقم المترشح أو الاسم الكامل">
      </div>

      <button class="search-button" id="searchButton" type="button">
        <span>بحث</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.4"/>
        </svg>
      </button>
    </section>

    <div class="results-list" id="resultsList"></div>

    <section class="text-section" id="textSection"></section>

    <a class="contact-button" href="{{ url_for('contact') }}">
      <span>طلب التواصل</span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 12a7 7 0 0 1 14 0v4a2 2 0 0 1-2 2h-2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M9 18h3a2 2 0 0 0 2-2v-1h-3a2 2 0 0 0-2 2v1Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
      </svg>
    </a>

    <div class="footer">epsilon | dev. med said mohameden</div>
    <div class="footer-links">
      <a href="{{ url_for('about') }}">من نحن</a>
      <a href="{{ url_for('privacy') }}">سياسة الخصوصية</a>
      <a href="{{ url_for('contact') }}">تواصل معنا</a>
    </div>
  </main>

  <script>
    const state = {
      exam: '',
      title: '',
      offers: [],
      offerIndex: 0,
      offerTimer: null,
      centersLoaded: false,
    };

    const labels = {
      fullName: 'الاسم الكامل',
      candidateNumber: 'رقم المترشح',
      birthPlace: 'مكان الميلاد',
      birthDate: 'تاريخ الميلاد',
      centerName: 'مركز الامتحان',
      wilaya: 'الولاية',
      moughataa: 'المقاطعة',
      score: 'المعدل',
      decision: 'القرار',
      rank: 'الترتيب',
    };

    const iconSvg = {
      fullName: '<path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
      candidateNumber: '<path d="M4 7h16M4 17h16M8 4l-2 16M18 4l-2 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
      centerName: '<path d="M3 21h18M5 21V9h14v12M4 9l8-5 8 5M9 13h6M9 17h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
      wilaya: '<path d="M12 21s7-5.1 7-11a7 7 0 1 0-14 0c0 5.9 7 11 7 11Z" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="2.2"/>',
      score: '<path d="M4 17 9 12l4 4 7-9M4 21h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
      decision: '<path d="M7 3h10l3 3v15H4V3h3Z" stroke="currentColor" stroke-width="2.2"/><path d="m8 13 2.5 2.5L16 10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
      default: '<path d="M7 7h10M7 12h10M7 17h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
    };

    const tiles = document.querySelectorAll('.result-tile');
    const searchCard = document.getElementById('searchCard');
    const searchTitle = document.getElementById('searchTitle');
    const centerField = document.getElementById('centerField');
    const centerSelect = document.getElementById('centerSelect');
    const queryInput = document.getElementById('queryInput');
    const searchButton = document.getElementById('searchButton');
    const resultsList = document.getElementById('resultsList');
    const offerStage = document.getElementById('offerStage');
    const textSection = document.getElementById('textSection');

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function rowIcon(key) {
      return `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">${iconSvg[key] || iconSvg.default}</svg>`;
    }

    function selectExam(exam, title) {
      state.exam = exam;
      state.title = title;
      tiles.forEach((tile) => tile.classList.toggle('active', tile.dataset.exam === exam));
      searchTitle.textContent = title;
      searchCard.classList.add('active');
      resultsList.innerHTML = '';
      queryInput.value = '';
      queryInput.focus();
      centerField.classList.toggle('hidden', exam !== 'concours');
      if (exam === 'concours') loadCenters();
      searchCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    async function loadCenters() {
      if (state.centersLoaded) return;
      centerSelect.innerHTML = '<option value="">جاري تحميل المراكز...</option>';
      try {
        const response = await fetch('/api/results/concours/centers');
        const data = await response.json();
        const centers = data.centers || [];
        centerSelect.innerHTML = '<option value="">مركز الامتحان</option>' +
          centers.map((center) => `<option value="${escapeHtml(center)}">${escapeHtml(center)}</option>`).join('');
        state.centersLoaded = true;
      } catch (error) {
        centerSelect.innerHTML = '<option value="">تعذر تحميل المراكز</option>';
      }
    }

    function resultRows(result) {
      const keys = ['fullName', 'candidateNumber'];
      if (result.birthPlace) keys.push('birthPlace');
      if (result.birthDate) keys.push('birthDate');
      if (result.centerName) keys.push('centerName');
      if (result.wilaya) keys.push('wilaya');
      if (result.moughataa) keys.push('moughataa');
      if (result.score) keys.push('score');
      if (result.decision) keys.push('decision');
      if (result.rank) keys.push('rank');

      return keys
        .filter((key) => result[key] !== undefined && result[key] !== null && String(result[key]).trim() !== '')
        .map((key) => `
          <div class="result-row">
            <div class="result-label">
              <span class="row-icon">${rowIcon(key)}</span>
              <span>${labels[key]}</span>
            </div>
            <div class="result-value">${escapeHtml(result[key])}</div>
          </div>
        `)
        .join('');
    }

    function isSuccess(result) {
      if (result.examType === 'concours') {
        const score = Number(String(result.score || '').replace(',', '.'));
        return Number.isFinite(score) && score >= 100;
      }
      return String(result.decision || '').toLowerCase().includes('admis');
    }

    function renderResults(results) {
      if (!results.length) {
        resultsList.innerHTML = '<div class="message-card">لم يتم العثور على نتيجة مطابقة.</div>';
        return;
      }

      resultsList.innerHTML = results.map((result) => {
        const success = isSuccess(result);
        return `
          ${success ? '<div class="message-card success"><strong>مبروك! لقد نجحت</strong><br>نتمنى لك مستقبلا موفقا ومشرقا</div>' : ''}
          <article class="result-card">
            <h3>
              <span class="row-icon">${rowIcon('candidateNumber')}</span>
              <span>بيانات المترشح</span>
            </h3>
            ${resultRows(result)}
          </article>
        `;
      }).join('');
    }

    async function runSearch() {
      if (!state.exam) {
        resultsList.innerHTML = '<div class="message-card">اختر نوع المسابقة أولا.</div>';
        return;
      }
      const query = queryInput.value.trim();
      const center = centerSelect.value.trim();
      if (state.exam === 'concours' && !center) {
        resultsList.innerHTML = '<div class="message-card error">اختر مركز الامتحان أولا.</div>';
        return;
      }
      if (!query) {
        resultsList.innerHTML = '<div class="message-card error">اكتب رقم المترشح أو الاسم الكامل.</div>';
        return;
      }

      searchButton.disabled = true;
      searchButton.querySelector('span').textContent = 'جاري البحث...';
      try {
        const params = new URLSearchParams({ q: query });
        if (state.exam === 'concours') params.set('center', center);
        const response = await fetch(`/api/results/${state.exam}?${params.toString()}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'تعذر البحث');
        renderResults(data.results || []);
      } catch (error) {
        resultsList.innerHTML = `<div class="message-card error">${escapeHtml(error.message || 'حدث خطأ أثناء البحث.')}</div>`;
      } finally {
        searchButton.disabled = false;
        searchButton.querySelector('span').textContent = 'بحث';
      }
    }

    function renderOffer() {
      clearTimeout(state.offerTimer);
      if (!state.offers.length) return;
      const offer = state.offers[state.offerIndex];
      offerStage.innerHTML = `
        <img src="${escapeHtml(offer.imageUrl)}" alt="${escapeHtml(offer.title || 'عرض')}">
        ${state.offers.length > 1 ? `
          <div class="offer-dots">
            ${state.offers.map((_, index) => `<button class="offer-dot ${index === state.offerIndex ? 'active' : ''}" type="button" aria-label="عرض ${index + 1}"></button>`).join('')}
          </div>
        ` : ''}
      `;
      if (state.offers.length > 1) {
        const duration = Math.max(1, Number(offer.durationSeconds || 5));
        state.offerTimer = setTimeout(() => {
          state.offerIndex = (state.offerIndex + 1) % state.offers.length;
          renderOffer();
        }, duration * 1000);
      }
    }

    async function loadOffers() {
      try {
        const response = await fetch('/api/offers');
        const data = await response.json();
        state.offers = (data.offers || []).filter((offer) => offer.imageUrl);
        if (state.offers.length) renderOffer();

        const text = data.textSection || {};
        if (text.active && (text.title || text.body)) {
          textSection.classList.add('active');
          textSection.innerHTML = `
            ${text.title ? `<h2>${escapeHtml(text.title)}</h2>` : ''}
            ${text.body ? `<p>${escapeHtml(text.body)}</p>` : ''}
          `;
        }
      } catch (_) {
        state.offers = [];
      }
    }

    tiles.forEach((tile) => {
      tile.addEventListener('click', () => selectExam(tile.dataset.exam, tile.dataset.title));
    });
    searchButton.addEventListener('click', runSearch);
    queryInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') runSearch();
    });

    loadOffers();
  </script>
</body>
</html>
